<!doctype html>
<html lang="pt/br">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="/src/css/base.css" />
  <link rel="stylesheet" href="/src/css/faixa-superior.css">
  <link rel="stylesheet" href="/src/css/adiciona-card.css">
  <link rel="stylesheet" href="/src/css/footer.css" />
  <link rel="stylesheet" href="/src/css/formulario.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>trabalho-js</title>
</head>

<body>
  <div id="app">

    <header id="header">
      <div id=faixa-superior>
        <a class="logo" href="index.html">
          <picture>
            <img src="/img/tcg-logo.png" alt="logo-de-pokémon-tcg" />
          </picture>
        </a>
        <nav>
          <ul>
            <li><a href="adiciona-card.html">Adicionar Card</a></li>
            <li><a href="cartas.html">Cartas</a></li>
            <li><a>Pokémons estampas ilustradas live</a></li>
            <li><a>Como jogar</a></li>
            <li><a>Novidades</a></li>
          </ul>
        </nav>
      </div>

      <div class="faixa-meio">
        <img id="esquerda" src="/img/cards-esquerda.png" alt="cards pokémons da lateral esquerda">
            <h1>Cards Pokémon</h1>
        <img id="direita" src="/img/cards-direita.png" alt="cards pokémons da lateral direita">
        <div class="faixa-final">
        </div>
      </div>

    </header>
    <main id="main">
      <section>
        <div class="formulario-container">
          <form action="" id="formulario">
            <label for="nome">Nome
              <input type="text" name="nome" id="nome" placeholder="Nome do card" required>
            </label>
            <label for="tipo">Tipo
              <select name="tipo" id="tipo">
                <option value="normal">Normal</option>
                <option value="eletrico">Elétrico</option>
                <option value="fogo">Fogo</option>
                <option value="agua">Água</option>
                <option value="planta">Planta</option>
                <option value="gelo">Gelo</option>
                <option value="lutador">Lutador</option>
                <option value="veneno">Veneno</option>
                <option value="terra">Terra</option>
                <option value="rocha">Rocha</option>
                <option value="inseto">Inseto</option>
                <option value="fantasma">Fantasma</option>
                <option value="psiquico">Psíquico</option>
                <option value="dragao">Dragão</option>
                <option value="fada">Fada</option>
              </select> 
            </label>
            <label for="quantidade">Quantidade<br>
              <input type="number" min="1" name="quantidade" id="quantidade" placeholder="Quantidade de unidades" required>
            </label>
            <label for="raridade">Raridade
              <select name="raridade" id="raridade">
                <option value="comum">Comum</option>
                <option value="incomum">Incomum</option>
                <option value="raro">Raro</option>
                <option value="raro">duplamente raro</option>
                <option value="super raro">Super raro</option>
                <option value="imersivo">Imersivo</option>
                <option value="ultra-raro">Ultra raro</option>
              </select> 
            </label>
            <label for="imagem">Imagem
              <input 
                type="file"
                name="imagem"
                id="imagem"
                accept=" .jpg, .jpeg, .png, .webp"
                required
                >
            </label>
            <button type="submit">Adicionar</button>
          </form>
        </div>
      </section>

      <section>
        <h2>Meus cards</h2>
        <div id="lista"></div>
      </section>

    </main>
    <footer id="footer">
      <nav>
        <ul>
          <li><a>Suporte</a></li>
          <li><a>Termos de Uso</a></li>
          <li><a>Política de Privacidade</a></li>
        </ul>
      </nav>
    </footer>
    <script type="module" src="/src/crud-pokemon.js"></script>
  </div>


</body>

</html>
