<!doctype html>
<html lang="pt/br">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="/src/css/base.css" />
  <link rel="stylesheet" href="/src/css/faixa-superior.css">
  <link rel="stylesheet" href="/src/css/adiciona-card.css">
  <link rel="stylesheet" href="/src/css/footer.css" />
  <link rel="stylesheet" href="/src/css/formulario.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>trabalho-js</title>
</head>

<body>
  <div id="app">

    <header id="header">
      <div id=faixa-superior>
        <a class="logo" href="index.html">
          <picture>
            <img src="/img/tcg-logo.png" alt="logo-de-pokémon-tcg" />
          </picture>
        </a>
        <nav>
          <ul>
            <li><a href="adiciona-card.html">Adicionar Card</a></li>
            <li><a href="cartas.html">Cartas</a></li>
            <li><a>Pokémons estampas ilustradas live</a></li>
            <li><a>Como jogar</a></li>
            <li><a>Novidades</a></li>
            <li><a href="register.html">Registro</a></li>
          </ul>
        </nav>
      </div>

      <div class="faixa-meio">
        <img id="esquerda" src="/img/cards-esquerda.png" alt="cards pokémons da lateral esquerda">
            <h1>Login</h1>
        <img id="direita" src="/img/cards-direita.png" alt="cards pokémons da lateral direita">
        <div class="faixa-final">
        </div>
      </div>

    </header>
    <main id="main">
      <section>
        <div class="formulario-container">
          <form action="" id="formulario">
            <label for="email">Email
                <input type="email" name="email" id="email" placeholder="e-mail">
            </label>
            <label for="senha">Senha
                <input type="password" id="senha" name="senha" placeholder="senha">
            </label>
            <button type="submit">Logar</button>
            <a href="registro.html">Registre-se</a>
          </form>
        </div>
      </section>

      <section>
        <h2>Meus cards</h2>
        <div id="lista"></div>
      </section>

    </main>
    <footer id="footer">
      <nav>
        <ul>
          <li><a>Suporte</a></li>
          <li><a>Termos de Uso</a></li>
          <li><a>Política de Privacidade</a></li>
        </ul>
      </nav>
    </footer>
  </div>

  <script type="module" src="/src/login.js"></script>

</body>

</html>
